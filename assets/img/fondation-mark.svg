<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Fondation PRODELI">
  <title>Fondation PRODELI</title>
  <!-- Le losange seul, sans le mot-symbole : sur une carte dont le titre dit
       déjà « Fondation PRODELI », le lockup complet ferait doublon.
       « DL » = Denis Lomela. Vert du logo : #009028. -->
  <path d="M70 6 134 70 70 134 6 70Z" fill="#009028"/>
  <text x="70" y="70" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="600" font-size="52" fill="#ffffff" letter-spacing="1">DL</text>
</svg>
